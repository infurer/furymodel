[package]
name = "furymodel"
description = "FuryModel: a model file format laid out for streaming layers and experts from disk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
tempfile.workspace = true

# gxhash needs AES (and SSE2 or NEON) at compile time; without them the
# crate leaves gxhash3-128 out. The condition must stay hash::GXHASH's.
[target.'cfg(any(all(target_arch = "x86_64", target_feature = "aes", target_feature = "sse2"), all(target_arch = "aarch64", target_feature = "aes", target_feature = "neon")))'.dependencies]
gxhash.workspace = true

[lints]
workspace = true
