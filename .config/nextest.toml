# On macOS, Rust's standard library makes a child's pipes with pipe(2) and
# marks them close-on-exec only afterwards, so that a test nextest spawns
# on another thread meanwhile can inherit one and hold the other test's
# output open until it exits too: nextest then calls that test leaky. The
# leak timeout waits far longer than any test runs; a subprocess that
# outlives its test by more is still a leak.
[[profile.default.overrides]]
platform = { host = 'cfg(target_os = "macos")' }
leak-timeout = "60s"

# The tests a build in the Nix sandbox can run, which checks.nextest,
# checks.nextest-portable and the package's check run: every test but those
# that need what the sandbox lacks, such as a GPU or the network, which carry
# `outside_sandbox` in their names. It inherits the default profile's
# settings, the leak timeout among them.
[profile.sandbox]
default-filter = 'not test(/outside_sandbox/)'
